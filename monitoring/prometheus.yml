global:
  scrape_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['192.168.100.241:9100','192.168.100.242:9100','192.168.100.243:9100','192.168.100.244:9100']

  - job_name: pve
    metrics_path: /pve
    params: {module: [default], cluster: ['1'], node: ['1']}
    static_configs:
      - targets: ['192.168.100.241', '192.168.100.242']
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: 'pve-exporter:9221'}

  - job_name: ping
    metrics_path: /probe
    params: {module: [icmp]}
    static_configs:
      - targets: ['192.168.100.1','192.168.100.2','1.1.1.1','8.8.8.8']
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: 'blackbox:9115'}
 
  - job_name: speedtest
    scrape_interval: 15m
    scrape_timeout: 90s
    static_configs:
      - targets: ['speedtest:9798']
